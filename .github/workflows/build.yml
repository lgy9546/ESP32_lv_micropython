name: Build lv_micropython ESP32-MINI-1 AutoRelease2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 你的配置文件
        uses: actions/checkout@v4
        with:
          path: myconfig

      - name: 拉取 lv_micropython release/v8（LVGL8.3 + IDF4.4）
        run: |
          set -e
          git clone --depth 1 --recursive https://github.com/lvgl/lv_micropython.git
          cd lv_micropython
          git checkout release/v8
          git submodule update --init --recursive

      - name: 复制板子配置、驱动、lv_conf
        run: |
          set -e
          cp -r myconfig/boards/ESP32_MINI_1_4M lv_micropython/ports/esp32/boards/
          cp myconfig/lv_conf.h lv_micropython/lib/lvgl/lv_conf.h
          cp myconfig/modules/* lv_micropython/ports/esp32/modules/

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: 编译固件
        run: |
          cd lv_micropython/ports/esp32
          make BOARD=ESP32_MINI_1_4M -j$(nproc)

      - name: 备用Artifact下载
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: lv_micropython/ports/esp32/build-ESP32_MINI_1_4M/firmware.bin

      - name: 自动生成Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-$(date +%Y%m%d-%H%M%S)"
          name: "build-$(date +%Y%m%d-%H%M%S)"
          body: |
            ESP32-MINI-1 4M | ST7789+EC11
            lv_micropython release/v8（LVGL8.3 / IDF4.4）
          files: |
            lv_micropython/ports/esp32/build-ESP32_MINI_1_4M/firmware.bin
